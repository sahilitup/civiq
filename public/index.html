<h1 class="sr-only">CIVIQ: report garbage in Gurugram and track it until it is cleared</h1>

<div class="app">
  <div id="map" aria-label="Map of garbage reports in Gurugram"></div>

  <header class="topbar" id="topbar">
    <a class="tb-brand" href="/" data-link aria-label="CIVIQ home"><img src="/logo.svg" alt="CIVIQ" class="logo"></a>
    <div class="search" role="search" id="searchBox">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" data-i18n-ph="search" data-i18n-aria="search" placeholder="Search a place, ward or official">
      <kbd class="kbd">/</kbd>
      <button class="x sm tb-search-close" id="searchClose" aria-label="Close search"><svg class="i"><use href="#i-x"/></svg></button>
      <div id="searchResults" class="search-results hidden" role="listbox"></div>
    </div>
    <div class="tb-filters" id="tbFilters"></div>
    <nav class="tb-nav" aria-label="Menu">
      <a href="/communities" data-link class="dot-host" title="Communities"><svg class="i"><use href="#i-users"/></svg><span data-i18n="communities">Communities</span><i class="dot-badge hidden" id="commDot"></i></a>
      <a href="/wards" data-link title="Ward leaderboard"><svg class="i"><use href="#i-trophy"/></svg><span data-i18n="wardsHead">Wards</span></a>
      <a href="/analytics" title="Analytics"><svg class="i"><use href="#i-chart"/></svg><span data-i18n="analytics">Analytics</span></a>
      <button data-act="whatsnew" title="What&#39;s new"><svg class="i"><use href="#i-sparkle"/></svg><span data-i18n="whatsNew">What's new</span></button>
      <button data-act="about" title="About"><svg class="i"><use href="#i-info"/></svg><span data-i18n="about">About</span></button>
    </nav>
    <div class="tb-right">
      <button class="tb-icon" id="searchOpen" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="tb-lang" data-act="lang" data-i18n-aria="langSwitchLabel"><svg class="i"><use href="#i-lang"/></svg><span data-i18n="langSwitch">हिन्दी</span></button>
      <button class="tb-icon tb-menu" data-act="menu" aria-label="Menu"><svg class="i"><use href="#i-list"/></svg></button>
      <button class="btn btn-red tb-report" id="tbReport"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="reportGarbage">Report garbage</span></button>
    </div>
  </header>
  <div id="mapToast" class="map-toast hidden" role="status"></div>

  <aside class="sheet" id="sheet" data-snap="peek" aria-label="CIVIQ panel">
    <div class="grabber" id="grabber" role="button" tabindex="0" aria-label="Expand panel"><span></span></div>
    <div class="view" id="view"></div>
  </aside>

  <button class="fab" id="reportFab"><svg class="i"><use href="#i-camera"/></svg><span data-i18n="reportGarbage">Report garbage</span></button>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
